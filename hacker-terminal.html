<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NODE-07 // Terminal</title>
<style>
:root{--g:#00ff9c;--g2:#00c978;--dim:#0a3d2a;--bg:#020806;--red:#ff2e4d;--cyan:#27e3ff;--amber:#ffb800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--g);font-family:"Courier New",Consolas,monospace;overflow:hidden}
#rain{position:fixed;inset:0;z-index:0}
.scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
.vig{position:fixed;inset:0;z-index:49;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.screen{position:fixed;inset:0;z-index:2;display:none}
.screen.on{display:block}
.glow{text-shadow:0 0 6px var(--g),0 0 18px rgba(0,255,156,.5)}
/* console */
#console .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);height:min(560px,86vh);background:rgba(2,12,8,.88);border:1px solid var(--g2);box-shadow:0 0 30px rgba(0,255,156,.25),inset 0 0 40px rgba(0,255,156,.06);display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--dim);font-size:12px;color:var(--g2);letter-spacing:2px}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g2);margin-right:6px;opacity:.7}
#out{flex:1;overflow-y:auto;padding:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#out::-webkit-scrollbar,.res::-webkit-scrollbar{width:6px}#out::-webkit-scrollbar-thumb,.res::-webkit-scrollbar-thumb{background:var(--g2)}
.line.err{color:var(--red)}.line.warn{color:var(--amber)}.line.info{color:var(--cyan)}.line.dim{color:#2c8f66}
.inrow{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--dim);font-size:14px}
.inrow input{flex:1;background:transparent;border:0;outline:0;color:var(--g);font:inherit;caret-color:var(--g)}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#1d7a55;letter-spacing:2px}
/* flash */
#flash{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.82)}
#flash h1{font-size:clamp(34px,8vw,92px);letter-spacing:8px;color:var(--g);animation:glitch .35s infinite}
#flash p{margin-top:14px;letter-spacing:6px;color:var(--cyan)}
@keyframes glitch{0%{transform:translate(0);text-shadow:3px 0 var(--red),-3px 0 var(--cyan)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px);text-shadow:-3px 0 var(--red),3px 0 var(--cyan)}75%{transform:translate(-2px,-1px)}100%{transform:translate(0)}}
/* dashboard */
#dash{background:radial-gradient(circle at 50% 20%,rgba(0,255,156,.07),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,156,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,156,.07) 1px,transparent 1px);background-size:44px 44px;animation:gm 8s linear infinite}
@keyframes gm{to{background-position:0 44px,44px 0}}
.top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 26px;border-bottom:1px solid var(--dim);background:rgba(2,12,8,.8);font-size:12px;letter-spacing:2px}
.top b{font-size:18px;letter-spacing:6px}
.stat span{margin-left:22px;color:var(--g2)}.stat i{color:var(--cyan);font-style:normal}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.15}}
.main{position:relative;height:calc(100% - 52px);overflow-y:auto;padding:30px 26px 60px}
.center{max-width:1100px;margin:0 auto}
.title{text-align:center;margin:20px 0 6px;font-size:clamp(22px,4vw,40px);letter-spacing:10px}
.sub{text-align:center;color:#2c8f66;letter-spacing:4px;font-size:12px;margin-bottom:34px}
.sbtn{display:block;margin:0 auto;padding:18px 70px;font:inherit;font-size:20px;letter-spacing:8px;color:var(--g);background:rgba(0,255,156,.06);border:1px solid var(--g);cursor:pointer;box-shadow:0 0 22px rgba(0,255,156,.35);animation:pulse 2s infinite;transition:.2s}
.sbtn:hover{background:var(--g);color:#001a10}
@keyframes pulse{50%{box-shadow:0 0 44px rgba(0,255,156,.7)}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:10px}
.card{position:relative;padding:26px 20px;border:1px solid var(--g2);background:rgba(2,16,10,.85);cursor:pointer;text-align:center;overflow:hidden;transition:.25s;animation:rise .5s both}
.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.card:hover{transform:translateY(-4px);box-shadow:0 0 28px rgba(0,255,156,.45);border-color:var(--g)}
.card::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--g);top:-4px;box-shadow:0 0 12px var(--g);animation:sw 3s linear infinite}
@keyframes sw{to{top:104%}}
.card svg{width:54px;height:54px;stroke:var(--g);fill:none;stroke-width:1.5;margin-bottom:12px}
.card h3{letter-spacing:3px;font-size:16px;margin-bottom:8px}.card p{font-size:12px;color:#2c8f66}
.back{background:none;border:1px solid var(--g2);color:var(--g2);font:inherit;padding:6px 14px;margin-bottom:18px;cursor:pointer;letter-spacing:2px}.back:hover{background:var(--g2);color:#001a10}
.panel{border:1px solid var(--g2);background:rgba(2,16,10,.88);padding:26px;margin-bottom:20px;box-shadow:0 0 22px rgba(0,255,156,.15)}
.panel h2{letter-spacing:5px;margin-bottom:18px;font-size:18px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:18px}
label{display:block;font-size:11px;letter-spacing:3px;color:#2c8f66;margin-bottom:6px}
.panel input[type=text]{width:100%;padding:12px;background:#010a06;border:1px solid var(--g2);color:var(--g);font:inherit;font-size:16px;outline:0}
.panel input[type=text]:focus{box-shadow:0 0 14px rgba(0,255,156,.5);border-color:var(--g)}
.go{padding:13px 40px;font:inherit;font-size:15px;letter-spacing:5px;color:#001a10;background:var(--g);border:0;cursor:pointer;box-shadow:0 0 18px rgba(0,255,156,.5)}.go:hover{background:#7affc9}
.drop{border:2px dashed var(--g2);padding:34px;text-align:center;cursor:pointer;color:var(--g2);letter-spacing:3px;position:relative;overflow:hidden}
.drop:hover{background:rgba(0,255,156,.06)}
.drop img{max-height:230px;max-width:100%;display:block;margin:0 auto}
.drop .bx{position:absolute;border:2px solid var(--red);box-shadow:0 0 14px var(--red);display:none}
/* scanning */
#scanbox{display:none}
.pb{height:8px;background:#031a10;border:1px solid var(--g2);margin:12px 0}.pb div{height:100%;width:0;background:var(--g);box-shadow:0 0 10px var(--g)}
#slog{font-size:12px;color:#2c8f66;height:120px;overflow:hidden;line-height:1.6}
/* results */
#results{display:none}
.rh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:13px;letter-spacing:2px}
.rh b{color:var(--cyan)}
.res{max-height:62vh;overflow-y:auto;border:1px solid var(--g2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#04261a;text-align:left;padding:10px;letter-spacing:2px;font-size:11px;color:var(--cyan);z-index:1}
td{padding:8px 10px;border-top:1px solid #072a1c;white-space:nowrap}
tbody tr{cursor:pointer;animation:fin .35s both}@keyframes fin{from{opacity:0;transform:translateX(-10px)}}
tbody tr:hover{background:rgba(0,255,156,.12)}
.av{width:34px;height:34px;border:1px solid var(--g2);display:block;overflow:hidden}
.av img,.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.av img.tall{object-position:50% 38%}
.ph.tallbg::before{content:"";position:absolute;inset:-12px;background:var(--bg) center/cover;filter:blur(14px) brightness(.55)}
.ph img.tall{object-fit:contain;position:relative;z-index:1}
.ph::after{z-index:2}
.av svg{width:100%;height:100%}
.m{color:var(--amber)}
/* modal */
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px}
#modal .in{width:min(760px,100%);max-height:92vh;overflow:auto;background:#031209;border:1px solid var(--g);box-shadow:0 0 40px rgba(0,255,156,.4);padding:24px;position:relative}
#modal .x{position:absolute;right:14px;top:10px;cursor:pointer;font-size:22px;color:var(--red)}
.prof{display:grid;grid-template-columns:170px 1fr;gap:22px}
.prof .ph{width:170px;height:200px;border:1px solid var(--g);position:relative;overflow:hidden}
.prof .ph svg{width:100%;height:100%}
.prof .ph::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--g);box-shadow:0 0 10px var(--g);animation:sw2 2.4s linear infinite}
@keyframes sw2{0%{top:0}50%{top:100%}100%{top:0}}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:13px}.kv span:nth-child(odd){color:#2c8f66;letter-spacing:2px;font-size:11px;padding-top:2px}
.tag{display:inline-block;padding:2px 8px;border:1px solid var(--red);color:var(--red);font-size:11px;letter-spacing:2px;margin-top:10px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.zone{border:2px dashed var(--g2);padding:10px;cursor:pointer;min-height:130px}.zone:hover,.zone.over{background:rgba(0,255,156,.08);border-color:var(--g)}
.zt{font-size:12px;letter-spacing:2px;margin-bottom:6px}.zt a{float:right;color:var(--red);font-size:11px}
.zd{font-size:11px;color:#2c8f66;text-align:center;padding:10px 0}
.zth{display:flex;flex-wrap:wrap;gap:3px}.zth img{width:38px;height:46px;object-fit:cover;border:1px solid var(--g2)}
.pmh{font-size:12px;color:#2c8f66;line-height:1.6;margin-bottom:6px}
@media(max-width:620px){.zones{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.prof{grid-template-columns:1fr}.top{flex-direction:column;gap:6px}.stat span{margin:0 8px}}
</style>

<body>
<canvas id="rain"></canvas>
<div class="scan"></div><div class="vig"></div>

<!-- CONSOLE -->
<section id="console" class="screen on">
  <div class="box">
    <div class="bar"><div class="dots"><span></span><span></span><span></span></div><div>NODE-07 // SECURE SHELL</div><div class="blink">● LIVE</div></div>
    <div id="out"></div>
    <div class="inrow"><span class="glow" id="ps">root@node-07:~$</span><input id="cmd" autocomplete="off" spellcheck="false" autofocus></div>

  <div class="hint">TYPE <b>help</b> FOR COMMANDS &nbsp;|&nbsp; PRESS <b>F2</b> TO AUTO-TYPE THE KEY &nbsp;|&nbsp; <b>F3</b> PHOTO MANAGER &nbsp;|&nbsp; <b>F4</b> SOUND ON/OFF</div>
</section>

<!-- DASHBOARD -->
<section id="dash" class="screen">
  <div class="grid"></div>
  <div class="top"><div><b class="glow">◈ NODE-07</b></div><div class="stat"><span>NODE <i>ONLINE</i></span><span>ENCRYPTION <i>AES-4096</i></span><span>PROXY <i id="px">0.0.0.0</i></span><span><a onclick="pm()" style="cursor:pointer;color:var(--cyan)">[PHOTOS F3]</a></span><span id="clk"></span></div></div>
  <div class="main"><div class="center" id="view"></div></div>
</section>

<div id="modal"><div class="in"><span class="x" onclick="closeM()">✕</span><div id="mbody"></div></div></div>

<script>
/* ============ CONFIG ============ */
const SECRET_CODE   = "shadow protocol 7";   // <-- secret phrase to unlock the 2nd menu (case-insensitive)
const RESULT_COUNT  = 100;                   // records generated per name search
const PHOTO_MATCHES = 24;
const SHOW_HINTS    = true;                 // false = hide the on-screen key hints (clean screen)
let   SOUND         = true;                 // sound effects (F4 toggles on/off)
/* ================================ */

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Sound (WebAudio, no files needed) ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type="square",v=.04,delay=0,slide=0){
  if(!SOUND)return;const c=ac();if(!c)return;
  const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,v=.05,delay=0){
  if(!SOUND)return;const c=ac();if(!c)return;
  const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type="highpass";f.frequency.value=2500;
  g.gain.value=v;src.buffer=b;src.connect(f);f.connect(g);g.connect(c.destination);src.start(c.currentTime+delay);
}
const snd={
  key(){noise(.03,.07);tone(900+Math.random()*500,.025,"square",.015)},
  enter(){noise(.05,.09);tone(420,.07,"square",.03)},
  blip(){tone(1200+Math.random()*900,.04,"sine",.03)},
  tick(){tone(880,.05,"square",.03);tone(1320,.06,"square",.03,.05)},
  ui(){tone(700,.05,"square",.03);tone(1050,.07,"square",.03,.05)},
  err(){tone(170,.18,"sawtooth",.05);tone(130,.22,"sawtooth",.05,.12)},
  ok(){tone(660,.1,"sine",.06);tone(990,.16,"sine",.06,.1)},
  done(){tone(520,.1,"triangle",.07);tone(780,.1,"triangle",.07,.1);tone(1040,.2,"triangle",.07,.2)},
  granted(){[392,523,659,784].forEach((f,i)=>tone(f,.35,"sawtooth",.05,i*.13));tone(1046,.9,"sine",.06,.55);tone(70,1.1,"sine",.12,0,-30)}
};
addEventListener("keydown",e=>{
  if(e.key==="F4"){e.preventDefault();SOUND=!SOUND;if(SOUND){ac();snd.ok()}return}
  if(e.target&&e.target.tagName==="INPUT"){if(e.key==="Enter")snd.enter();else if(e.key.length===1||e.key==="Backspace")snd.key()}
});
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest(".card,.sbtn,.go,.back,tbody tr,.drop"))snd.ui()});


/* ---------- Matrix rain ---------- */
const cv=$("#rain"),cx=cv.getContext("2d");let cols,drops,fs=16;
function rs(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/fs);drops=Array.from({length:cols},()=>Math.random()*-60)}
rs();addEventListener("resize",rs);
let rainAlpha=.09;let rainColor="#00ff9c";
setInterval(()=>{
  cx.fillStyle=`rgba(2,8,6,${rainAlpha})`;cx.fillRect(0,0,cv.width,cv.height);
  cx.font=fs+"px monospace";
  for(let i=0;i<cols;i++){
    const ch=Math.random()>.5?"1":"0";
    cx.fillStyle=Math.random()>.97?"#d6ffe9":rainColor;
    cx.fillText(ch,i*fs,drops[i]*fs);
    if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;
    drops[i]++;
  }
},45);

/* ---------- Console ---------- */
const out=$("#out"),cmd=$("#cmd");
function print(t,cls=""){const d=document.createElement("div");d.className="line "+cls;d.textContent=t;out.appendChild(d);out.scrollTop=out.scrollHeight;if(cls==="err")snd.err()}
async function typeLines(arr,d=90,cls=""){for(const l of arr){print(l,cls);await sleep(d)}}
let busy=false,unlocked=false;
(async()=>{busy=true;
  await typeLines(["NODE-07 SECURE SHELL v4.2.1","Kernel 6.8.0-hx #1 SMP","[ OK ] Loading modules...","[ OK ] Establishing encrypted tunnel...","[ OK ] Rotating proxy chain (7 hops)...","[WARN] Restricted area. Unauthorized access is logged.",""],140);
  print("Enter the key phrase to unlock the main frame. Type 'help' for commands.","info");busy=false;cmd.focus();
})();
document.addEventListener("click",()=>{if($("#console").classList.contains("on"))cmd.focus()});
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rip=()=>`${rnd(11,223)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`;
const HIST=[];let hp=0;
async function progress(label,steps=20,delay=60){const d=document.createElement("div");d.className="line";out.appendChild(d);for(let i=0;i<=steps;i++){const p=Math.round(i/steps*100);d.textContent=`${label.padEnd(26,".")} [${"█".repeat(i)}${"░".repeat(steps-i)}] ${p}%`;out.scrollTop=out.scrollHeight;await sleep(delay)}return d}
const hex=n=>Array.from({length:n},()=>rnd(0,15).toString(16)).join("");
const THEMES={green:["#00ff9c","#00c978","#0a3d2a"],red:["#ff2e4d","#cc2040","#3d0a14"],cyan:["#27e3ff","#1ab5cc","#0a2f3d"],amber:["#ffb800","#cc9400","#3d2e0a"]};
const HELP=["Available commands:","",
"  help              show this list",
"  sysinfo           system information",
"  ifconfig          network interfaces",
"  netstat           active connections",
"  top               running processes",
"  nmap <ip>         port scan a target",
"  trace <host>      trace route through proxy chain",
"  whois <host>      domain registry lookup",
"  sniff             capture network packets",
"  ssh <ip>          open remote session",
"  decrypt <file>    brute-force an encrypted file",
"  crack <hash>      crack a password hash",
"  color <name>      theme: green | red | cyan | amber",
"  scan / ping <h>   network scan / ping",
"  ls, whoami, status, date, uptime, history, clear","",
"  [!] Main frame is locked. A key phrase is required."];
async function run(raw){
  const c=raw.trim(),low=c.toLowerCase();print("root@node-07:~$ "+raw,"dim");
  if(!c)return;HIST.push(raw);hp=HIST.length;
  if(low===SECRET_CODE.toLowerCase())return unlock();
  const [h,...a]=low.split(/\s+/);
  switch(h){
    case"help":case"?":await typeLines(HELP,35);break;
    case"whoami":print("root (uid=0) // guest-tunnel");break;
    case"status":await typeLines(["NODE-07 ........ ONLINE","FIREWALL ....... ACTIVE","MAIN FRAME ..... LOCKED","TRACE .......... "+rnd(2,9)+"% (low)"],60);break;
    case"ls":print("core.bin   keyring.enc   vault.enc   vault/   .mainframe   readme.txt");break;
    case"clear":out.innerHTML="";break;
    case"date":print(new Date().toString());break;
    case"uptime":print(` ${new Date().toTimeString().slice(0,8)} up ${rnd(12,90)} days, ${rnd(1,23)}:${String(rnd(10,59))}, 1 user, load average: 0.${rnd(10,99)}, 0.${rnd(10,99)}, 0.${rnd(10,99)}`);break;
    case"history":HIST.forEach((x,i)=>print(`  ${i+1}  ${x}`));break;
    case"echo":print(a.join(" "));break;
    case"exit":case"logout":print("Cannot exit: shell is bound to a locked session.","err");break;
    case"cat":case"sudo":case"rm":case"su":print("Permission denied.","err");break;
    case"sysinfo":case"neofetch":await typeLines(["      ▄▄▄▄▄▄▄       root@node-07","    ▄█████████▄     ---------------","   ███▀▀▀▀▀▀███     OS: HexOS 6.8 x86_64","   ███  ◉  ◉ ███     Kernel: 6.8.0-hx","   ███   ▼   ███     Uptime: "+rnd(12,90)+" days","   ▀██▄▄▄▄▄▄██▀     Shell: sshx 4.2","     ▀▀▀▀▀▀▀▀       CPU: 64 x Quantum-X 4.8GHz","                    RAM: 512 GB (31% used)","                    Tunnel: 7 hops / TOR+VPN"],70);break;
    case"ifconfig":await typeLines(["eth0: flags=4163<UP,BROADCAST,RUNNING>  mtu 1500",`      inet ${rip()}  netmask 255.255.255.0`,`      ether ${[0,0,0,0,0,0].map(()=>hex(2)).join(":")}`,"      RX packets "+rnd(100000,999999)+"  TX packets "+rnd(100000,999999),"","tun0: flags=4305<UP,POINTOPOINT,RUNNING>",`      inet 10.8.0.${rnd(2,200)}  destination 10.8.0.1`,"      [encrypted tunnel active]"],60);break;

if(!SHOW_HINTS)document.querySelector(".hint").style.display="none";
function makeRecord(first,last,seed,idx){
  const r=rng(seed);
  const fem=FEM.includes(first)?true:MAL.includes(first)?false:(/(ova|eva|ina)$/i.test(last)||/a$/i.test(first));
  const pl=r()<.32?PLACES[0]:pick(r,PLACES);
  const dist=pick(r,pl[2]);
  const age=(()=>{const q=r();return q<.10?pick(r,[18,19,20]):q<.28?pick(r,[21,22,23,24,25,26]):q<.50?rnd2(r,27,34):q<.72?rnd2(r,35,44):q<.88?rnd2(r,45,54):rnd2(r,55,72)})(),y=2026-age,mo=rnd2(r,1,12),da=rnd2(r,1,28);
  const p2=n=>String(n).padStart(2,"0");
  const pp=pick(r,["AA","AB","AC","AD","KA"])+String(rnd2(r,1000000,9999999));
  const iss=2026-rnd2(r,0,8),exp=iss+10;
  const sc=y>=2000?(fem?6:5):(fem?4:3);
  const pinfl=`${sc}${p2(da)}${p2(mo)}${String(y).slice(2)}${rnd2(r,100,999)}${rnd2(r,100,999)}${rnd2(r,0,9)}`;
  const code=pick(r,["90","91","93","94","95","97","98","99","33","88","77","50","55"]);
  const mail=(first+"."+last+rnd2(r,1,99)).toLowerCase().replace(/[^a-z0-9.]/g,"")+"@"+pick(r,MAILS);
  return{id:idx+1,first,last,fem,age,dob:`${y}-${p2(mo)}-${p2(da)}`,
    city:pl[0],region:pl[1],district:dist,country:"Uzbekistan",cc:"UZ",
    addr:`${pick(r,STREETS)} str. ${rnd2(r,1,160)}, apt ${rnd2(r,1,96)}`,
    father:pick(r,MAL)+(fem?" qizi":" o'g'li"),pinfl,
    passport:pp,issued:`${iss}-${p2(rnd2(r,1,12))}-${p2(rnd2(r,1,28))}`,expires:`${exp}-${p2(rnd2(r,1,12))}-${p2(rnd2(r,1,28))}`,
    phone:`+998 ${code} ${rnd2(r,100,999)} ${p2(rnd2(r,0,99))} ${p2(rnd2(r,0,99))}`,
    email:mail,job:pick(r,JOB),marital:pick(r,MAR),
    match:Math.round(55+r()*44),avSeed:seed^0x9e3779b9,
    risk:pick(r,["LOW","LOW","MEDIUM","HIGH"])};
}
function rnd2(r,a,b){return Math.floor(r()*(b-a+1))+a}
const cap=s=>s.trim().replace(/\s+/g," ").split(" ").map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");

/* ---------- Views ---------- */
const view=$("#view");
const IC={
  photo:'<svg viewBox="0 0 64 64"><rect x="8" y="14" width="48" height="36" rx="3"/><circle cx="32" cy="32" r="10"/><path d="M22 14l3-5h14l3 5"/><path d="M4 4h8M4 4v8M60 4h-8M60 4v8M4 60h8M4 60v-8M60 60h-8M60 60v-8"/></svg>',
  name:'<svg viewBox="0 0 64 64"><circle cx="26" cy="22" r="10"/><path d="M6 54c0-12 8-18 20-18s20 6 20 18"/><circle cx="46" cy="42" r="8"/><path d="M52 48l8 8"/></svg>',
  pass:'<svg viewBox="0 0 64 64"><rect x="12" y="6" width="40" height="52" rx="3"/><circle cx="32" cy="26" r="9"/><path d="M20 26h24M32 17c-5 5-5 13 0 18M32 17c5 5 5 13 0 18"/><path d="M20 46h24M20 51h24"/></svg>'};
function home(){
  view.innerHTML=`<h1 class="title glow">CONTROL PANEL</h1><div class="sub">GLOBAL IDENTITY DATABASE // ACCESS LEVEL: ROOT</div>
  <button class="sbtn" onclick="menu()">[ SEARCH ]</button>`;
}
function menu(){
  view.innerHTML=`<button class="back" onclick="home()">← BACK</button><h1 class="title glow">SELECT SEARCH MODE</h1><div class="sub">CHOOSE QUERY METHOD</div>
  <div class="cards">
   <div class="card" onclick="photoV()">${IC.photo}<h3>SEARCH BY PHOTO</h3><p>Facial recognition scan</p></div>
   <div class="card" onclick="nameV()">${IC.name}<h3>SEARCH BY NAME</h3><p>First name + last name</p></div>
   <div class="card" onclick="passV()">${IC.pass}<h3>SEARCH BY PASSPORT</h3><p>Document number lookup</p></div>
  </div>`;
}
const LOGS=["Connecting to database cluster...","Handshake with node EU-West-3...","Bypassing rate limiter...","Querying identity registry...","Cross-referencing travel records...","Matching biometric hashes...","Decrypting records...","Compiling results..."];
async function scanning(label){
  const sb=$("#scanbox");sb.style.display="block";$("#results").style.display="none";
  const pb=sb.querySelector(".pb div"),lg=$("#slog");lg.innerHTML="";sb.querySelector("h2").textContent=label;
  let p=0;const tot=3600,t0=Date.now();
  await new Promise(res=>{const iv=setInterval(()=>{p=Math.min(100,(Date.now()-t0)/tot*100);pb.style.width=p+"%";
    if(Math.random()<.35){snd.blip();lg.innerHTML+=`<div>> ${LOGS[Math.floor(Math.random()*LOGS.length)]} <span class="m">${rip()}</span></div>`;lg.scrollTop=lg.scrollHeight}
    if(p>=100){clearInterval(iv);res()}},90)});
  sb.style.display="none";snd.done();
}
const SCANBOX=`<div class="panel" id="scanbox"><h2></h2><div class="pb"><div></div></div><div id="slog"></div></div><div id="results"></div>`;

function nameV(){
  view.innerHTML=`<button class="back" onclick="menu()">← BACK</button>
  <div class="panel"><h2 class="glow">SEARCH BY NAME</h2>
   <div class="frow"><div><label>FIRST NAME</label><input type="text" id="fn" placeholder="e.g. Aziz" autocomplete="off"></div>
   <div><label>LAST NAME</label><input type="text" id="ln" placeholder="e.g. Karimov" autocomplete="off"></div></div>
   <button class="go" id="goN">SEARCH</button></div>${SCANBOX}`;
  const go=async()=>{
    const f=cap($("#fn").value),l=cap($("#ln").value);
    if(!f||!l){$("#fn").style.borderColor=f?"":"var(--red)";$("#ln").style.borderColor=l?"":"var(--red)";return}
    await scanning(`QUERYING: ${f.toUpperCase()} ${l.toUpperCase()}`);
    const base=hash((f+"|"+l).toLowerCase());
    const recs=Array.from({length:RESULT_COUNT},(_,i)=>makeRecord(f,l,hash(base+"#"+i),i));
    showRes(recs,`${f} ${l}`);
  };
  $("#goN").onclick=go;[ "#fn","#ln"].forEach(s=>$(s).addEventListener("keydown",e=>{if(e.key==="Enter")go()}));
  $("#fn").focus();
}
function passV(){
  view.innerHTML=`<button class="back" onclick="menu()">← BACK</button>
  <div class="panel"><h2 class="glow">SEARCH BY PASSPORT</h2>
   <div class="frow"><div><label>PASSPORT NUMBER</label><input type="text" id="pn" placeholder="e.g. AB1234567" autocomplete="off" maxlength="12"></div></div>
   <button class="go" id="goP">SEARCH</button></div>${SCANBOX}`;
  const go=async()=>{
    const v=$("#pn").value.trim().toUpperCase();
    if(v.length<5){$("#pn").style.borderColor="var(--red)";return}
    await scanning(`LOOKUP: ${esc(v)}`);
    const r=rng(hash(v)),[f,l]=genPerson(r);
    const main=makeRecord(f,l,hash(v),0);main.passport=v;main.match=100;
    const rel=Array.from({length:5},(_,i)=>{const rr=rng(hash(v+"r"+i)),fn=pick(rr,rr()<.5?MAL:FEM),bs=l.replace(/a$/,"");return makeRecord(fn,FEM.includes(fn)?bs+"a":bs,hash(v+"rel"+i),i+1)});
    showRes([main,...rel],`PASSPORT ${v}`,true);
    openM(main);
  };
  $("#goP").onclick=go;$("#pn").addEventListener("keydown",e=>{if(e.key==="Enter")go()});$("#pn").focus();
}
function photoV(){
  view.innerHTML=`<button class="back" onclick="menu()">← BACK</button>
  <div class="panel"><h2 class="glow">SEARCH BY PHOTO</h2>
   <div class="drop" id="drop"><div id="dtxt">[ CLICK OR DROP IMAGE HERE ]</div><div class="bx" id="bx"></div></div>
   <input type="file" id="file" accept="image/*" hidden><br>
   <button class="go" id="goF">SCAN FACE</button></div>${SCANBOX}`;
  let fileSeed=null;
  const drop=$("#drop"),fi=$("#file");
  const load=f=>{if(!f||!f.type.startsWith("image/"))return;fileSeed=hash(f.name+f.size);
    const u=URL.createObjectURL(f);drop.innerHTML=`<img src="${u}" id="pimg"><div class="bx" id="bx"></div>`};
  drop.onclick=()=>fi.click();fi.onchange=()=>load(fi.files[0]);
  drop.ondragover=e=>{e.preventDefault()};drop.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
  $("#goF").onclick=async()=>{
    if(fileSeed===null){drop.style.borderColor="var(--red)";return}
    const im=$("#pimg"),bx=$("#bx");
    if(im){const w=im.clientWidth,h=im.clientHeight,ox=im.offsetLeft;bx.style.cssText=`display:block;left:${ox+w*.3}px;top:${h*.12}px;width:${w*.4}px;height:${h*.6}px`;}
    await scanning("FACIAL RECOGNITION IN PROGRESS");
    const r=rng(fileSeed);
    const recs=Array.from({length:PHOTO_MATCHES},(_,i)=>(()=>{const pr=genPerson(r);return makeRecord(pr[0],pr[1],hash(fileSeed+"p"+i),i)})());
    recs.forEach((x,i)=>x.match=Math.max(41,Math.round(99-i*2.1-r()*3)));
    showRes(recs,"UPLOADED IMAGE");
  };
}
function showRes(recs,q,pass){
  assignPhotos(recs);
  const R=$("#results");R.style.display="block";
  R.innerHTML=`<div class="rh"><div>QUERY: <b>${esc(q)}</b></div><div>RECORDS FOUND: <b>${recs.length}</b></div></div>
  <div class="res"><table><thead><tr><th>#</th><th>PHOTO</th><th>FULL NAME</th><th>AGE</th><th>LOCATION</th><th>PASSPORT</th><th>MATCH</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  window._recs=recs;const tb=$("#tb");
  recs.forEach((x,i)=>{const tr=document.createElement("tr");tr.style.animationDelay=Math.min(i*25,1800)+"ms";
    tr.innerHTML=`<td>${i+1}</td><td><span class="av">${face(x)}</span></td><td>${esc(x.first)} ${esc(x.last)}</td><td>${x.age}</td><td>${esc(x.city)}, ${esc(x.district)}</td><td class="m">${x.passport}</td><td>${x.match}%</td>`;
    tr.onclick=()=>openM(x);tb.appendChild(tr)});
  R.scrollIntoView({behavior:"smooth"});
}
function openM(x){
  $("#mbody").innerHTML=`<h2 class="glow" style="letter-spacing:5px;margin-bottom:16px">SUBJECT FILE #${String(x.id).padStart(4,"0")}</h2>
  <div class="prof"><div><div class="ph">${face(x)}</div><div class="tag">RISK: ${x.risk}</div></div>
  <div class="kv">
   <span>FULL NAME</span><span>${esc(x.first)} ${esc(x.last)}</span>
   <span>FATHER'S NAME</span><span>${esc(x.father)}</span>
   <span>GENDER</span><span>${x.fem?"Female":"Male"}</span>
   <span>PINFL</span><span class="m">${x.pinfl}</span>
   <span>DATE OF BIRTH</span><span>${x.dob} (${x.age} y/o)</span>
   <span>MARITAL STATUS</span><span>${x.marital}</span>
   <span>OCCUPATION</span><span>${x.job}</span>
   <span>RESIDENCE</span><span>${esc(x.addr)}<br>${esc(x.district)} district, ${esc(x.city)}<br>${esc(x.region)}, Uzbekistan</span>
   <span>PASSPORT NO.</span><span class="m">${x.passport}</span>
   <span>ISSUED / EXPIRES</span><span>${x.issued} / ${x.expires}</span>
   <span>PHONE</span><span>${x.phone}</span>
   <span>EMAIL</span><span>${esc(x.email)}</span>
   <span>MATCH SCORE</span><span>${x.match}%</span>
  </div></div>`;
  $("#modal").style.display="flex";snd.ui();
}
function closeM(){$("#modal").style.display="none"}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});
addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
